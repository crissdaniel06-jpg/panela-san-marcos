<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | Panela San Marcos</title><link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <header class="site-header"><div class="container header-container"><a class="logo" href="index.html">Panela San Marcos</a><nav class="main-nav" aria-label="Navegación principal"><a href="productos.html">Productos</a><a href="carrito.html">Carrito</a><a href="favoritos.html">Favoritos</a></nav>                    <form id="header-search-form" class="header-search-inline" role="search" autocomplete="off">
                <label class="visually-hidden" for="header-product-search">Buscar productos</label>
                <input id="header-product-search" type="search" placeholder="Buscar productos..." autocomplete="off" aria-autocomplete="list" aria-controls="header-search-suggestions" aria-expanded="false">
                <button class="header-search-submit" type="submit" aria-label="Buscar productos"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 1 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/></svg></button>
                <div id="header-search-suggestions" class="header-search-suggestions" hidden>
                    <p id="header-search-status" class="header-search-status" role="status" aria-live="polite">Escribe para buscar productos.</p>
                    <ul id="header-search-results" class="header-search-results"></ul>
                    <a id="header-search-all" class="header-search-all" href="productos.html" hidden>Ver todos los resultados</a>
                </div>
            </form>
        <div class="header-actions"><a class="cart-button" href="carrito.html">Carrito <span class="cart-count">(0)</span></a></div></div></header>
  <main id="main-content" class="container account-page"><h1>Mi cuenta</h1><p id="account-state" class="form-feedback" role="status"></p>
    <form id="profile-form" class="account-form" hidden><h2>Datos personales</h2>
      <div class="form-field"><label for="profile-first">Nombre</label><input id="profile-first" required autocomplete="given-name"></div>
      <div class="form-field"><label for="profile-last">Apellido</label><input id="profile-last" required autocomplete="family-name"></div>
      <div class="form-field"><label for="profile-phone">Celular</label><input id="profile-phone" type="tel" autocomplete="tel"></div>
      <div class="form-field"><label for="profile-address">Dirección</label><input id="profile-address" autocomplete="street-address"></div>
      <div class="form-field"><label for="profile-city">Ciudad</label><input id="profile-city" autocomplete="address-level2"></div>
      <div class="form-field"><label for="profile-email">Correo electrónico</label><input id="profile-email" type="email" required autocomplete="email"></div>
      <button class="action-button" type="submit">Guardar perfil</button>
    </form>
    <form id="password-form" class="account-form" hidden><h2>Cambiar contraseña</h2><div class="form-field"><label for="new-password">Nueva contraseña</label><input id="new-password" type="password" minlength="8" required autocomplete="new-password"></div><button class="action-button" type="submit">Actualizar contraseña</button></form>
  </main>
  <footer class="site-footer"><div class="container footer-container"><p>Panela San Marcos · <a href="ayuda.html">Ayuda</a></p></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase-config.js"></script><script src="js/productos.js"></script><script src="js/store.js"></script><script src="js/app.js"></script><script src="js/perfil.js"></script>
</body></html>
